<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

/* ── Theme variables ───────────────────────────────────────────────── */
:root {
  --bg:             #111111;
  --header-bg:      #1c1c1c;
  --header-border:  #2e2e2e;
  --modal-bg:       #1a1a1a;
  --modal-border:   #2e2e2e;
  --modal-shadow:   rgba(0,0,0,0.8);
  --backdrop:       rgba(0,0,0,0.75);
  --text:           #e0e0e0;
  --text-muted:     #888;
  --text-dim:       #444;
  --section-color:  #555;
  --input-bg:       #242424;
  --input-border:   #333;
  --input-color:    #e0e0e0;
  --input-ph:       #444;
  --btn2-bg:        #242424;
  --btn2-border:    #333;
  --btn2-color:     #888;
  --btn2-hover:     #2e2e2e;
  --btn2-hover-c:   #bbb;
  --accent:         #29b6f6;
  --accent-hover:   #4fc3f7;
  --accent-text:    #000;
  --handle:         rgba(255,255,255,0.02);
  --handle-hover:   rgba(255,255,255,0.08);
  --corner:         rgba(255,255,255,0.04);
  --corner-hover:   rgba(255,255,255,0.14);
  --slot-border:    #1e1e1e;
  --add-bg:         #1a1a1a;
  --add-border:     #2a2a2a;
  --add-color:      #444;
  --add-hover-bg:   #222;
  --add-hover-c:    #aaa;
  --add-hover-b:    #555;
  --shortcut-bg:    #212121;
  --fav-bg:         #212121;
  --fav-border:     #333;
  --url-color:      #888;
  --url-hover-bg:   #252525;
  --url-hover-c:    #aaa;
  --url-focus-bg:   #2a2a2a;
  --url-focus-c:    #e0e0e0;
  --footer-border:  #2e2e2e;
  --footer-color:   #444;
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg);
  user-select: none;
  font-family: 'Segoe UI', sans-serif;
}

/* ── Overlay container ─────────────────────────────────────────────── */
#ov { position: absolute; inset: 0; pointer-events: none; }

/* ── Cell overlay ──────────────────────────────────────────────────── */
.co { position: absolute; }

.co-header {
  position: absolute;
  top: 0; left: 0; right: 0; height: 22px;
  background: var(--header-bg);
  border-bottom: 1px solid var(--header-border);
  display: flex; align-items: center;
  padding: 0 4px;
  pointer-events: auto;
  gap: 4px;
}

.drag-icon {
  color: var(--text-dim); font-size: 13px; line-height: 1;
  cursor: grab; padding: 0 2px; flex-shrink: 0;
  transition: color .15s;
}
.drag-icon:hover { color: var(--text-muted); }

.url-input {
  flex: 1;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 3px;
  color: var(--url-color);
  font-size: 10px;
  font-family: 'Segoe UI', sans-serif;
  padding: 1px 5px;
  outline: none;
  min-width: 0;
  pointer-events: auto;
  cursor: text;
}
.url-input:hover { background: var(--url-hover-bg); color: var(--url-hover-c); }
.url-input:focus { background: var(--url-focus-bg); border-color: var(--accent); color: var(--url-focus-c); }

.audio-btn {
  flex-shrink: 0;
  background: none; border: none;
  color: var(--text-dim); font-size: 12px; line-height: 1;
  cursor: pointer; padding: 0 2px;
  transition: color .15s;
  pointer-events: auto;
}
.audio-btn:hover { color: var(--text-muted); }
.audio-btn.active { color: var(--accent); }

.close-btn {
  flex-shrink: 0;
  background: none; border: none;
  color: var(--text-dim); font-size: 14px; line-height: 1;
  cursor: pointer; padding: 0 2px;
  transition: color .15s;
  pointer-events: auto;
}
.close-btn:hover { color: #e57373; }

/* ── Resize handles ────────────────────────────────────────────────── */
.rr { position: absolute; top: 32px; right: 0; width: 10px; bottom: 10px; cursor: ew-resize; pointer-events: auto; background: var(--handle); transition: background .15s; }
.rl { position: absolute; top: 32px; left:  0; width: 10px; bottom: 10px; cursor: ew-resize; pointer-events: auto; background: var(--handle); transition: background .15s; }
.rb { position: absolute; bottom: 0; left: 10px; height: 10px; right: 10px; cursor: ns-resize; pointer-events: auto; background: var(--handle); transition: background .15s; }
.rt { position: absolute; top: 22px; left: 10px; height: 10px; right: 10px; cursor: ns-resize; pointer-events: auto; background: var(--handle); transition: background .15s; }
.rr:hover, .rl:hover, .rb:hover, .rt:hover { background: var(--handle-hover); }

.rc  { position: absolute; bottom: 0; right: 0; width: 10px; height: 10px; cursor: nwse-resize; pointer-events: auto; background: var(--corner); transition: background .15s; }
.rtl { position: absolute; top: 22px; left:  0; width: 10px; height: 10px; cursor: nwse-resize; pointer-events: auto; background: var(--corner); transition: background .15s; }
.rtr { position: absolute; top: 22px; right: 0; width: 10px; height: 10px; cursor: nesw-resize; pointer-events: auto; background: var(--corner); transition: background .15s; }
.rbl { position: absolute; bottom: 0; left:  0; width: 10px; height: 10px; cursor: nesw-resize; pointer-events: auto; background: var(--corner); transition: background .15s; }
.rc:hover, .rtl:hover, .rtr:hover, .rbl:hover { background: var(--corner-hover); }

/* ── Empty slot ────────────────────────────────────────────────────── */
.es {
  position: absolute;
  display: flex; align-items: center; justify-content: center;
  border: 1px dashed var(--slot-border);
  pointer-events: auto;
}

.add-btn {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: var(--add-bg);
  border: 2px solid var(--add-border);
  color: var(--add-color); font-size: 24px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .2s;
}
.add-btn:hover { background: var(--add-hover-bg); color: var(--add-hover-c); border-color: var(--add-hover-b); transform: scale(1.08); }

/* ── Drag ghost ────────────────────────────────────────────────────── */
#ghost {
  position: fixed; display: none; pointer-events: none; z-index: 9999;
  border: 2px solid var(--accent); border-radius: 4px;
  background: rgba(41,182,246,0.18);
  box-shadow: 0 6px 20px rgba(0,0,0,0.6);
}

/* ── Drop / Resize indicators ──────────────────────────────────────── */
#drop {
  position: absolute; display: none; pointer-events: none; z-index: 998;
  border: 2px solid var(--accent); border-radius: 3px;
  background: rgba(41,182,246,0.12);
  transition: left .08s, top .08s, width .08s, height .08s;
}
#drop.bad { border-color: #e57373; background: rgba(229,115,115,0.12); }

#rsz {
  position: absolute; display: none; pointer-events: none; z-index: 997;
  border: 2px dashed #81c784; border-radius: 3px;
  background: rgba(129,199,132,0.12);
}
#rsz.bad { border-color: #e57373; background: rgba(229,115,115,0.12); }

/* ── Modal ─────────────────────────────────────────────────────────── */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 10000;
  background: var(--backdrop);
  display: none;
  align-items: center; justify-content: center;
  pointer-events: auto;
}

.modal-box {
  background: var(--modal-bg);
  border: 1px solid var(--modal-border);
  border-radius: 8px;
  padding: 24px;
  display: flex; flex-direction: column; gap: 12px;
  max-height: 85vh; overflow-y: auto;
  box-shadow: 0 20px 60px var(--modal-shadow);
}

.modal-title {
  font-size: 15px; font-weight: 600; color: var(--text);
  padding-bottom: 4px; border-bottom: 1px solid var(--modal-border);
}

.modal-section {
  font-size: 10px; font-weight: 600;
  color: var(--section-color); text-transform: uppercase; letter-spacing: 0.8px;
  margin-top: 4px;
}

.modal-input {
  width: 100%;
  background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 4px;
  color: var(--input-color); font-size: 12px; font-family: 'Segoe UI', sans-serif;
  padding: 7px 10px; outline: none;
  transition: border-color .15s;
}
.modal-input:focus { border-color: var(--accent); }
.modal-input::placeholder { color: var(--input-ph); }

.modal-row { display: flex; gap: 12px; }
.modal-row label {
  flex: 1; display: flex; flex-direction: column; gap: 5px;
  font-size: 11px; color: var(--text-muted);
}
.modal-row input[type="number"] {
  width: 100%;
  background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 4px;
  color: var(--input-color); font-size: 13px; font-family: 'Segoe UI', sans-serif;
  padding: 7px 10px; outline: none;
}
.modal-row input[type="number"]:focus { border-color: var(--accent); }

.shortcuts-table { width: 100%; border-collapse: separate; border-spacing: 0 3px; }
.shortcuts-table tr td:first-child {
  font-size: 11px; font-weight: 600; color: var(--accent);
  background: var(--shortcut-bg); border-radius: 3px;
  padding: 4px 10px; width: 55px;
}
.shortcuts-table tr td:last-child {
  font-size: 11px; color: var(--text-muted);
  padding: 4px 10px;
}

.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }

.btn-primary {
  background: var(--accent); border: none; border-radius: 4px;
  color: var(--accent-text); font-size: 12px; font-weight: 600;
  padding: 8px 18px; cursor: pointer; transition: background .15s;
}
.btn-primary:hover { background: var(--accent-hover); }

.btn-secondary {
  background: var(--btn2-bg); border: 1px solid var(--btn2-border); border-radius: 4px;
  color: var(--btn2-color); font-size: 12px;
  padding: 8px 18px; cursor: pointer; transition: all .15s;
}
.btn-secondary:hover { background: var(--btn2-hover); color: var(--btn2-hover-c); }

.btn-danger {
  background: none; border: 1px solid #c62828; border-radius: 4px;
  color: #e57373; font-size: 12px;
  padding: 8px 18px; cursor: pointer; transition: all .15s;
}
.btn-danger:hover { background: rgba(229,115,115,0.12); color: #ef9a9a; }

/* ── Favourites in URL prompt ──────────────────────────────────────── */
#fav-buttons { display: flex; gap: 6px; flex-wrap: wrap; }

.fav-btn {
  background: var(--fav-bg); border: 1px solid var(--fav-border); border-radius: 4px;
  color: var(--accent); font-size: 11px; font-family: 'Segoe UI', sans-serif;
  padding: 4px 10px; cursor: pointer;
  max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  transition: all .15s;
}
.fav-btn:hover { border-color: var(--accent); }

</style>
</head>
<body>
  <div id="ov"></div>
  <div id="ghost"></div>
  <div id="drop"></div>
  <div id="rsz"></div>

  <!-- URL prompt modal -->
  <div id="url-modal" class="modal-backdrop">
    <div class="modal-box" style="width:420px">
      <div class="modal-title">Open New Panel</div>
      <input id="url-input" class="modal-input" type="text" placeholder="Enter URL or search (empty = Google)">
      <div id="fav-buttons"></div>
      <div class="modal-actions">
        <button id="url-cancel"  class="btn-secondary">Cancel</button>
        <button id="url-confirm" class="btn-primary">Open</button>
      </div>
    </div>
  </div>

  <!-- Settings modal -->
  <div id="settings-modal" class="modal-backdrop">
    <div class="modal-box" style="width:460px">
      <div class="modal-title">Settings</div>

      <div class="modal-section">Grid</div>
      <div class="modal-row">
        <label>Columns<input type="number" id="set-cols" min="1"></label>
        <label>Rows<input type="number" id="set-rows" min="1"></label>
      </div>

      <div class="modal-section">Favourites</div>
      <input id="fav1" class="modal-input" type="text" placeholder="Favourite 1 (URL)">
      <input id="fav2" class="modal-input" type="text" placeholder="Favourite 2 (URL)">
      <input id="fav3" class="modal-input" type="text" placeholder="Favourite 3 (URL)">

      <div class="modal-section">Keyboard Shortcuts</div>
      <table class="shortcuts-table">
        <tr><td>F</td><td>Fullscreen on / off</td></tr>
        <tr><td>S</td><td>Open / close settings</td></tr>
        <tr><td>D</td><td>Edit mode on / off (handles, URL bar, audio)</td></tr>
        <tr><td>ESC</td><td>Close modal · Cancel action · Exit fullscreen</td></tr>
      </table>

      <div class="modal-actions">
        <button id="settings-reset" class="btn-danger">Reset to defaults</button>
        <div style="flex:1"></div>
        <button id="settings-close" class="btn-secondary">Close</button>
        <button id="settings-save"  class="btn-primary">Save</button>
      </div>

      <div style="text-align:center; padding-top:4px; border-top:1px solid var(--footer-border);">
        <a href="https://github.com/NiklasPreis" style="font-size:11px; color:var(--footer-color); text-decoration:none;" id="github-link">MultiViewer — by NiklasPreis</a>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
