<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #111;
  user-select: none;
  font-family: 'Segoe UI', sans-serif;
}

/* ── Overlay container ─────────────────────────────────────────────── */
#ov {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

/* ── Cell overlay ──────────────────────────────────────────────────── */
.co { position: absolute; }

.co-header {
  position: absolute;
  top: 0; left: 0; right: 0; height: 22px;
  background: #1c1c1c;
  border-bottom: 1px solid #2e2e2e;
  display: flex; align-items: center;
  padding: 0 4px;
  pointer-events: auto;
  gap: 4px;
}

.drag-icon {
  color: #444; font-size: 13px; line-height: 1;
  cursor: grab; padding: 0 2px; flex-shrink: 0;
  transition: color .15s;
}
.drag-icon:hover { color: #999; }

.url-input {
  flex: 1;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 3px;
  color: #888;
  font-size: 10px;
  font-family: 'Segoe UI', sans-serif;
  padding: 1px 5px;
  outline: none;
  min-width: 0;
  pointer-events: auto;
  cursor: text;
}
.url-input:hover { background: #252525; color: #aaa; }
.url-input:focus { background: #2a2a2a; border-color: #29b6f6; color: #e0e0e0; }

.audio-btn {
  flex-shrink: 0;
  background: none; border: none;
  color: #444; font-size: 12px; line-height: 1;
  cursor: pointer; padding: 0 2px;
  transition: color .15s;
  pointer-events: auto;
}
.audio-btn:hover { color: #aaa; }
.audio-btn.active { color: #29b6f6; }

.close-btn {
  flex-shrink: 0;
  background: none; border: none;
  color: #444; font-size: 14px; line-height: 1;
  cursor: pointer; padding: 0 2px;
  transition: color .15s;
  pointer-events: auto;
}
.close-btn:hover { color: #e57373; }

/* ── Resize handles ────────────────────────────────────────────────── */
/* right edge */
.rr {
  position: absolute;
  top: 32px; right: 0; width: 10px; bottom: 10px;
  cursor: ew-resize; pointer-events: auto;
  background: rgba(255,255,255,0.02); transition: background .15s;
}
.rr:hover { background: rgba(255,255,255,0.08); }

/* bottom edge */
.rb {
  position: absolute;
  bottom: 0; left: 10px; height: 10px; right: 10px;
  cursor: ns-resize; pointer-events: auto;
  background: rgba(255,255,255,0.02); transition: background .15s;
}
.rb:hover { background: rgba(255,255,255,0.08); }

/* left edge */
.rl {
  position: absolute;
  top: 32px; left: 0; width: 10px; bottom: 10px;
  cursor: ew-resize; pointer-events: auto;
  background: rgba(255,255,255,0.02); transition: background .15s;
}
.rl:hover { background: rgba(255,255,255,0.08); }

/* top edge */
.rt {
  position: absolute;
  top: 22px; left: 10px; height: 10px; right: 10px;
  cursor: ns-resize; pointer-events: auto;
  background: rgba(255,255,255,0.02); transition: background .15s;
}
.rt:hover { background: rgba(255,255,255,0.08); }

/* corners */
.rc  { position: absolute; bottom: 0; right: 0; width: 10px; height: 10px; cursor: nwse-resize; pointer-events: auto; background: rgba(255,255,255,0.04); transition: background .15s; }
.rtl { position: absolute; top: 22px; left:  0; width: 10px; height: 10px; cursor: nwse-resize; pointer-events: auto; background: rgba(255,255,255,0.04); transition: background .15s; }
.rtr { position: absolute; top: 22px; right: 0; width: 10px; height: 10px; cursor: nesw-resize; pointer-events: auto; background: rgba(255,255,255,0.04); transition: background .15s; }
.rbl { position: absolute; bottom: 0; left:  0; width: 10px; height: 10px; cursor: nesw-resize; pointer-events: auto; background: rgba(255,255,255,0.04); transition: background .15s; }

.rc:hover, .rtl:hover, .rtr:hover, .rbl:hover { background: rgba(255,255,255,0.14); }

/* ── Empty slot ────────────────────────────────────────────────────── */
.es {
  position: absolute;
  display: flex; align-items: center; justify-content: center;
  border: 1px dashed #1e1e1e;
  pointer-events: auto;
}

.add-btn {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: #1a1a1a;
  border: 2px solid #2a2a2a;
  color: #444; font-size: 24px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .2s;
}
.add-btn:hover { background: #222; color: #aaa; border-color: #555; transform: scale(1.08); }

/* ── Drag ghost ────────────────────────────────────────────────────── */
#ghost {
  position: fixed; display: none; pointer-events: none; z-index: 9999;
  border: 2px solid #29b6f6; border-radius: 4px;
  background: rgba(41,182,246,0.18);
  box-shadow: 0 6px 20px rgba(0,0,0,0.6);
}

/* ── Drop indicator ────────────────────────────────────────────────── */
#drop {
  position: absolute; display: none; pointer-events: none; z-index: 998;
  border: 2px solid #29b6f6; border-radius: 3px;
  background: rgba(41,182,246,0.12);
  transition: left .08s, top .08s, width .08s, height .08s;
}
#drop.bad { border-color: #e57373; background: rgba(229,115,115,0.12); }

/* ── Resize indicator ──────────────────────────────────────────────── */
#rsz {
  position: absolute; display: none; pointer-events: none; z-index: 997;
  border: 2px dashed #81c784; border-radius: 3px;
  background: rgba(129,199,132,0.12);
}
#rsz.bad { border-color: #e57373; background: rgba(229,115,115,0.12); }

/* ── Modal ─────────────────────────────────────────────────────────── */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 10000;
  background: rgba(0,0,0,0.75);
  display: none;
  align-items: center; justify-content: center;
  pointer-events: auto;
}

.modal-box {
  background: #1a1a1a;
  border: 1px solid #2e2e2e;
  border-radius: 8px;
  padding: 24px;
  display: flex; flex-direction: column; gap: 12px;
  max-height: 85vh; overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.8);
}

.modal-title {
  font-size: 15px; font-weight: 600; color: #e0e0e0;
  padding-bottom: 4px; border-bottom: 1px solid #2e2e2e;
}

.modal-section {
  font-size: 10px; font-weight: 600;
  color: #555; text-transform: uppercase; letter-spacing: 0.8px;
  margin-top: 4px;
}

.modal-input {
  width: 100%;
  background: #242424; border: 1px solid #333; border-radius: 4px;
  color: #e0e0e0; font-size: 12px; font-family: 'Segoe UI', sans-serif;
  padding: 7px 10px; outline: none;
  transition: border-color .15s;
}
.modal-input:focus { border-color: #29b6f6; }
.modal-input::placeholder { color: #444; }

.modal-row { display: flex; gap: 12px; }
.modal-row label {
  flex: 1; display: flex; flex-direction: column; gap: 5px;
  font-size: 11px; color: #666;
}
.modal-row input[type="number"] {
  width: 100%;
  background: #242424; border: 1px solid #333; border-radius: 4px;
  color: #e0e0e0; font-size: 13px; font-family: 'Segoe UI', sans-serif;
  padding: 7px 10px; outline: none;
}
.modal-row input[type="number"]:focus { border-color: #29b6f6; }

.shortcuts-table { width: 100%; border-collapse: separate; border-spacing: 0 3px; }
.shortcuts-table tr td:first-child {
  font-size: 11px; font-weight: 600; color: #29b6f6;
  background: #212121; border-radius: 3px;
  padding: 4px 10px; width: 55px;
}
.shortcuts-table tr td:last-child {
  font-size: 11px; color: #888;
  padding: 4px 10px;
}

.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }

.btn-primary {
  background: #29b6f6; border: none; border-radius: 4px;
  color: #000; font-size: 12px; font-weight: 600;
  padding: 8px 18px; cursor: pointer; transition: background .15s;
}
.btn-primary:hover { background: #4fc3f7; }

.btn-secondary {
  background: #242424; border: 1px solid #333; border-radius: 4px;
  color: #888; font-size: 12px;
  padding: 8px 18px; cursor: pointer; transition: background .15s;
}
.btn-secondary:hover { background: #2e2e2e; color: #bbb; }

/* ── Favorites in URL prompt ───────────────────────────────────────── */
#fav-buttons { display: flex; gap: 6px; flex-wrap: wrap; }

.fav-btn {
  background: #212121; border: 1px solid #333; border-radius: 4px;
  color: #29b6f6; font-size: 11px; font-family: 'Segoe UI', sans-serif;
  padding: 4px 10px; cursor: pointer;
  max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  transition: all .15s;
}
.fav-btn:hover { background: #2a2a2a; border-color: #29b6f6; }
</style>
</head>
<body>
  <div id="ov"></div>
  <div id="ghost"></div>
  <div id="drop"></div>
  <div id="rsz"></div>

  <!-- URL prompt modal -->
  <div id="url-modal" class="modal-backdrop">
    <div class="modal-box" style="width:420px">
      <div class="modal-title">Neues Fenster öffnen</div>
      <input id="url-input" class="modal-input" type="text" placeholder="URL oder Suche eingeben (leer = Google)">
      <div id="fav-buttons"></div>
      <div class="modal-actions">
        <button id="url-cancel"  class="btn-secondary">Abbrechen</button>
        <button id="url-confirm" class="btn-primary">Öffnen</button>
      </div>
    </div>
  </div>

  <!-- Settings modal -->
  <div id="settings-modal" class="modal-backdrop">
    <div class="modal-box" style="width:460px">
      <div class="modal-title">Einstellungen</div>

      <div class="modal-section">Raster</div>
      <div class="modal-row">
        <label>Spalten (1–6)<input type="number" id="set-cols" min="1" max="6"></label>
        <label>Reihen (1–4)<input type="number" id="set-rows" min="1" max="4"></label>
      </div>

      <div class="modal-section">Favoriten</div>
      <input id="fav1" class="modal-input" type="text" placeholder="Favorit 1 (URL)">
      <input id="fav2" class="modal-input" type="text" placeholder="Favorit 2 (URL)">
      <input id="fav3" class="modal-input" type="text" placeholder="Favorit 3 (URL)">

      <div class="modal-section">Tastenkürzel</div>
      <table class="shortcuts-table">
        <tr><td>F</td><td>Vollbild ein / aus</td></tr>
        <tr><td>S</td><td>Einstellungen öffnen / schließen</td></tr>
        <tr><td>D</td><td>Bearbeitungsmodus ein / aus (Handles, URL-Leiste, Audio)</td></tr>
        <tr><td>ESC</td><td>Modal schließen · Aktion abbrechen · Vollbild verlassen</td></tr>
      </table>

      <div class="modal-actions">
        <button id="settings-close" class="btn-secondary">Schließen</button>
        <button id="settings-save"  class="btn-primary">Speichern</button>
      </div>

      <div style="text-align:center; padding-top:4px; border-top:1px solid #2e2e2e;">
        <a href="https://github.com/NiklasPreis" style="font-size:11px; color:#444; text-decoration:none;" id="github-link">MultiViewer — by NiklasPreis</a>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
