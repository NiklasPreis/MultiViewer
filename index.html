<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #111;
  user-select: none;
  font-family: 'Segoe UI', sans-serif;
}

/* ── Overlay container ─────────────────────────────────────────────── */
#ov {
  position: absolute;
  inset: 0;
  pointer-events: none; /* children opt-in */
}

/* ── Cell overlay (full cell size, only handles have pointer-events) ─ */
.co { position: absolute; }

.co-header {
  position: absolute;
  top: 0; left: 0; right: 10px; height: 22px;
  background: #1c1c1c;
  border-bottom: 1px solid #2e2e2e;
  border-right:  1px solid #2e2e2e;
  display: flex; align-items: center;
  padding: 0 4px;
  pointer-events: auto;
  gap: 4px;
}

.drag-icon {
  color: #444; font-size: 13px; line-height: 1;
  cursor: grab; padding: 0 2px; flex-shrink: 0;
  transition: color .15s;
}
.drag-icon:hover { color: #999; }

.cell-title {
  flex: 1;
  font-size: 10px; color: #555;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}

.close-btn {
  flex-shrink: 0;
  background: none; border: none;
  color: #444; font-size: 14px; line-height: 1;
  cursor: pointer; padding: 0 2px;
  transition: color .15s;
}
.close-btn:hover { color: #e57373; }

/* Resize strips */
.rr { /* right  */
  position: absolute;
  top: 22px; right: 0; width: 10px; bottom: 10px;
  cursor: ew-resize; pointer-events: auto;
  background: rgba(255,255,255,0.02);
  transition: background .15s;
}
.rr:hover { background: rgba(255,255,255,0.08); }

.rb { /* bottom */
  position: absolute;
  bottom: 0; left: 0; height: 10px; right: 10px;
  top: auto;
  cursor: ns-resize; pointer-events: auto;
  background: rgba(255,255,255,0.02);
  transition: background .15s;
}
.rb:hover { background: rgba(255,255,255,0.08); }

.rc { /* corner */
  position: absolute;
  bottom: 0; right: 0; width: 10px; height: 10px;
  cursor: nwse-resize; pointer-events: auto;
  background: rgba(255,255,255,0.04);
  transition: background .15s;
}
.rc:hover { background: rgba(255,255,255,0.14); }

/* ── Empty slot ────────────────────────────────────────────────────── */
.es {
  position: absolute;
  display: flex; align-items: center; justify-content: center;
  border: 1px dashed #222;
  pointer-events: auto;
}

.add-btn {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: #1a1a1a;
  border: 2px solid #2d2d2d;
  color: #555; font-size: 24px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .2s;
}
.add-btn:hover { background: #252525; color: #aaa; border-color: #555; transform: scale(1.08); }

/* ── Drag ghost ────────────────────────────────────────────────────── */
#ghost {
  position: fixed; display: none; pointer-events: none; z-index: 9999;
  border: 2px solid #29b6f6;
  border-radius: 4px;
  background: rgba(41,182,246,0.18);
  box-shadow: 0 6px 20px rgba(0,0,0,0.6);
}

/* ── Drop indicator ────────────────────────────────────────────────── */
#drop {
  position: absolute; display: none; pointer-events: none; z-index: 998;
  border: 2px solid #29b6f6;
  border-radius: 3px;
  background: rgba(41,182,246,0.12);
  transition: left .08s, top .08s, width .08s, height .08s;
}
#drop.bad { border-color: #e57373; background: rgba(229,115,115,0.12); }

/* ── Resize indicator ──────────────────────────────────────────────── */
#rsz {
  position: absolute; display: none; pointer-events: none; z-index: 997;
  border: 2px dashed #81c784;
  border-radius: 3px;
  background: rgba(129,199,132,0.12);
}
#rsz.bad { border-color: #e57373; background: rgba(229,115,115,0.12); }
</style>
</head>
<body>
  <div id="ov"></div>
  <div id="ghost"></div>
  <div id="drop"></div>
  <div id="rsz"></div>
  <script src="renderer.js"></script>
</body>
</html>
